components:
  schemas:
    AccessLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        device:
          type: string
          maxLength: 20
        demo:
          type: boolean
        seed_key:
          type: string
          nullable: true
          maxLength: 120
        uid:
          type: string
          maxLength: 150
        user_type:
          type: string
          maxLength: 30
        ip:
          type: string
        user_agent:
          type: string
          maxLength: 500
        section:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        content:
          type: integer
          nullable: true
      required:
      - created_at
      - id
      - ip
      - user_agent
    Answer:
      type: object
      properties:
        question:
          type: integer
          minimum: 1
        options:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 100
        value:
          type: string
          default: ''
          maxLength: 4000
      required:
      - question
    Approval:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        content:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        author:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        version:
          type: integer
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/ApprovalStateEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
        reviewer:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        proposal:
          readOnly: true
        approved_version:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        current_revision:
          type: integer
          readOnly: true
      required:
      - approved_version
      - author
      - category
      - content
      - content_type
      - created_at
      - current_revision
      - id
      - proposal
      - reason
      - reviewed_at
      - reviewer
      - state
      - title
      - version
    ApprovalStateEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pendiente
        * `approved` - Aprobado
        * `rejected` - Rechazado
    Audit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        entity:
          type: string
          maxLength: 50
        action:
          type: string
          maxLength: 100
        resource:
          type: string
          maxLength: 150
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 500
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          nullable: true
      required:
      - action
      - created_at
      - id
    CatalogItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        catalog:
          type: integer
        parent:
          type: integer
          nullable: true
      required:
      - catalog
      - created_at
      - id
      - name
    CatalogType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        content_type:
          allOf:
          - $ref: '#/components/schemas/ContentTypeEnum'
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        active:
          type: boolean
        visible:
          type: boolean
        dynamic:
          type: boolean
          readOnly: true
        max_visible:
          type: integer
          maximum: 2147483647
          minimum: 1
        title_limit:
          type: integer
          maximum: 2147483647
          minimum: 1
        description_limit:
          type: integer
          maximum: 2147483647
          minimum: 1
        required_fields: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - dynamic
      - id
      - name
      - slug
    CodeEnum:
      enum:
      - superadmin
      - admin
      - gestor
      type: string
      description: |-
        * `superadmin` - Superadmin
        * `admin` - Admin
        * `gestor` - Gestor de Contenidos
    Content:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
        category_name:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        title:
          type: string
        description:
          type: string
        author:
          type: integer
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/ContentStateEnum'
          readOnly: true
        revision:
          type: integer
          readOnly: true
        validity:
          $ref: '#/components/schemas/ValidityEnum'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        manual_active:
          type: boolean
        extra_fields: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        details: {}
        public_visible:
          type: boolean
          readOnly: true
        has_published_version:
          type: boolean
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - author
      - category
      - category_name
      - content_type
      - created_at
      - description
      - has_published_version
      - id
      - permissions
      - public_visible
      - revision
      - state
      - submitted_at
      - title
      - updated_at
    ContentStateEnum:
      enum:
      - draft
      - pending
      - approved
      - rejected
      - hidden
      type: string
      description: |-
        * `draft` - Borrador
        * `pending` - Pendiente
        * `approved` - Aprobado
        * `rejected` - Rechazado
        * `hidden` - Oculto
    ContentTypeEnum:
      enum:
      - generic
      - news
      - event
      - notice
      - service
      - survey
      type: string
      description: |-
        * `generic` - generic
        * `news` - news
        * `event` - event
        * `notice` - notice
        * `service` - service
        * `survey` - survey
    EventTypeEnum:
      enum:
      - access
      - view
      type: string
      description: |-
        * `access` - Acceso
        * `view` - Visualización
    Grant:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        role:
          type: integer
          nullable: true
        category:
          type: integer
        operation:
          $ref: '#/components/schemas/OperationEnum'
      required:
      - category
      - id
      - operation
    KindEnum:
      enum:
      - multiple_ips
      - device_churn
      - activity_spike
      type: string
      description: |-
        * `multiple_ips` - Varias IP
        * `device_churn` - Cambio de dispositivos
        * `activity_spike` - Actividad inusual
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 256
      required:
      - email
      - password
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
