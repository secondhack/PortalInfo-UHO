openapi: 3.0.3
info:
  title: PortalInfo UHO
  version: 1.0.0
paths:
  /api/{slug}:
    get:
      operationId: api_list
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicContent'
          description: ''
  /api/admin/access-logs/:
    get:
      operationId: api_admin_access_logs_list
      parameters:
      - in: query
        name: content
        schema:
          type: integer
      - in: query
        name: data_scope
        schema:
          enum:
          - real
          - demo
          - all
          type: string
          default: real
          minLength: 1
        description: |-
          * `real` - real
          * `demo` - demo
          * `all` - all
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: device
        schema:
          type: string
      - in: query
        name: event_type
        schema:
          type: string
          enum:
          - access
          - view
        description: |-
          * `access` - Acceso
          * `view` - Visualización
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: period
        schema:
          enum:
          - today
          - 7d
          - 30d
          - month
          - custom
          type: string
          default: 7d
          minLength: 1
        description: |-
          * `today` - today
          * `7d` - 7d
          * `30d` - 30d
          * `month` - month
          * `custom` - custom
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: section
        schema:
          type: string
      - in: query
        name: uid
        schema:
          type: string
      - in: query
        name: user_type
        schema:
          type: string
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessLogList'
          description: ''
