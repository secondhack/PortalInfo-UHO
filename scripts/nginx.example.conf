# Base futura: configurar certificados y nombre real antes de usar.
server {
    listen 80;
    server_name localhost;
    root /srv/portalinfo/frontend/dist;
    location / { try_files $uri /index.html; }
    location /api/ { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }
    location /auth/ { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }
    location /portal-auth/ { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }
    location /portal/ { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }
    location /static/ { alias /srv/portalinfo/backend/staticfiles/; }
}
